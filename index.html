<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Session</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Session">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1a17;
    --surface:#0f2521;
    --surface-2:#143530;
    --line:#1f4a41;
    --chalk:#eaf5f2;
    --chalk-dim:#84a89e;
    --accent:#2de0c7;
    --accent-ink:#06231f;
    --danger:#ff5a45;
    --ok:#2de0c7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .hazard{
    height:7px;
    width:100%;
    background:repeating-linear-gradient(135deg, var(--accent) 0 14px, var(--bg) 14px 28px);
  }
  #app{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 60px;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.02em;
    margin:0;
    line-height:0.95;
  }
  h1{font-size:clamp(2.4rem,9vw,3.2rem);}
  h2{font-size:clamp(1.6rem,6vw,2rem);}
  p{margin:0;line-height:1.5;}
  .dim{color:var(--chalk-dim);}
  .tagline{color:var(--chalk-dim);font-size:0.95rem;margin-top:6px;}
  .header{margin-bottom:28px;}
  .header .kicker{color:var(--accent);font-weight:700;font-size:0.85rem;margin-bottom:4px;}

  .section{margin-top:36px;}
  .section-title{font-size:0.8rem;color:var(--chalk-dim);font-weight:600;margin-bottom:14px;}

  .prog-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:border-color .15s ease;
  }
  .prog-card:active{border-color:var(--accent);}
  .prog-card .txt h3{font-family:'Inter',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:4px;}
  .prog-card .txt p{font-size:0.85rem;color:var(--chalk-dim);}
  .prog-card .meta{text-align:right;flex-shrink:0;}
  .tag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    padding:3px 8px;
    border-radius:3px;
    background:var(--surface-2);
    color:var(--chalk-dim);
    border:1px solid var(--line);
    margin-bottom:6px;
  }
  .tag.circuit{color:var(--accent);border-color:#4a5522;}
  .tag.classic{color:#9cc7ff;border-color:#26364a;}
  .duration{font-size:0.78rem;color:var(--chalk-dim);}

  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:12px 16px;
    border-radius:6px;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    flex:1 1 calc(50% - 10px);
    text-align:center;
  }
  .chip:active{border-color:var(--accent);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:6px;
    font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;
    padding:15px 22px;cursor:pointer;width:100%;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{background:transparent;color:var(--chalk);border:1px solid var(--line);}
  .btn-ghost:active{border-color:var(--chalk-dim);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid #4a2622;}
  .btn-row{display:flex;gap:10px;margin-top:24px;}
  .btn-row .btn{width:auto;flex:1;}

  .back{
    color:var(--chalk-dim);font-size:0.9rem;font-weight:600;
    background:none;border:none;cursor:pointer;padding:0 0 20px 0;
    display:flex;align-items:center;gap:6px;
  }

  .exercise-row{
    display:flex;align-items:baseline;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .exercise-row:last-child{border-bottom:none;}
  .exercise-row .num{
    font-family:'Bebas Neue',sans-serif;color:var(--accent);font-size:1.3rem;width:26px;flex-shrink:0;
  }
  .exercise-row .info{flex:1;}
  .exercise-row .name{font-weight:700;font-size:0.98rem;}
  .exercise-row .sub{color:var(--chalk-dim);font-size:0.82rem;margin-top:2px;}
  .exercise-row .stat{color:var(--chalk-dim);font-size:0.82rem;text-align:right;white-space:nowrap;}

  .format-toggle{display:flex;gap:10px;margin:18px 0 26px;}
  .format-toggle .chip{flex:1;}
  .format-toggle .chip.active{border-color:var(--accent);color:var(--accent);}

  .chip.selected{border-color:var(--accent);color:var(--accent);background:#232a12;}
  .time-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px;}
  .time-chip-row .chip{flex:1 1 calc(33.333% - 6px);padding:10px 8px;}

  .builder-hint{font-size:0.78rem;color:var(--chalk-dim);margin:4px 0 12px;}

  .suggest-card{
    background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--accent);border-radius:6px;padding:18px 20px;margin-top:24px;
  }
  .suggest-card .kicker{color:var(--accent);font-weight:700;font-size:0.78rem;margin-bottom:6px;}
  .suggest-card h3{font-family:'Inter',sans-serif;font-weight:800;font-size:1.15rem;margin-bottom:4px;}
  .suggest-card p{font-size:0.85rem;color:var(--chalk-dim);margin-bottom:14px;}
  .suggest-card .btn{width:auto;padding:12px 20px;font-size:0.9rem;}

  /* --- session screen --- */
  .session-wrap{
    min-height:calc(100vh - 88px);
    display:flex;flex-direction:column;
  }
  .progress-track{
    height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:26px;
  }
  .progress-fill{height:100%;background:var(--accent);transition:width .25s linear;}
  .phase-meta{display:flex;justify-content:space-between;color:var(--chalk-dim);font-size:0.85rem;font-weight:600;margin-bottom:8px;}
  .phase-label{
    font-size:0.95rem;font-weight:700;margin-bottom:6px;
  }
  .phase-label.work{color:var(--accent);}
  .phase-label.rest{color:#9cc7ff;}
  .phase-label.ready{color:var(--chalk-dim);}
  .phase-label.manual{color:var(--accent);}

  .exercise-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,9vw,2.8rem);margin-bottom:24px;}

  .timer-zone{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;padding:20px 0 30px;
  }
  .timer-digits{
    font-family:'Bebas Neue',sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:clamp(4.5rem,26vw,7rem);
    line-height:1;
    color:var(--chalk);
  }
  .timer-digits.urgent{color:var(--danger);}
  .reps-target{font-size:1.3rem;color:var(--chalk-dim);}
  .reps-target b{color:var(--chalk);font-weight:800;}

  .next-up{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:12px 16px;font-size:0.85rem;color:var(--chalk-dim);margin-top:10px;
  }
  .next-up b{color:var(--chalk);}

  .controls{display:flex;gap:10px;margin-top:22px;}
  .ctrl-btn{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--chalk);
    padding:16px;border-radius:6px;font-weight:700;font-size:0.95rem;cursor:pointer;
  }
  .ctrl-btn.main{background:var(--accent);color:var(--accent-ink);border:none;}
  .quit-zone{margin-top:14px;text-align:center;}
  .quit-link{background:none;border:none;color:var(--chalk-dim);font-size:0.85rem;cursor:pointer;text-decoration:underline;}
  .quit-confirm{
    margin-top:14px;background:var(--surface);border:1px solid var(--danger);border-radius:6px;
    padding:14px;text-align:center;
  }
  .quit-confirm p{margin-bottom:12px;font-size:0.9rem;}

  .complete-wrap{
    min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;
  }
  .complete-wrap h1{font-size:clamp(2.6rem,10vw,3.4rem);}
  .stat-row{display:flex;gap:24px;margin:10px 0 30px;}
  .stat-row .stat{text-align:center;}
  .stat-row .stat .n{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--accent);}
  .stat-row .stat .l{font-size:0.75rem;color:var(--chalk-dim);}

  .stats-card{
    display:flex;gap:24px;background:var(--surface);border:1px solid var(--line);
    border-radius:6px;padding:16px 18px;margin-top:22px;
  }
  .stats-card .stat-block{flex:1;text-align:center;}
  .stats-card .flame{font-size:1.5rem;font-weight:800;}
  .stats-card .points{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--accent);}
  .stats-card .stat-sub{font-size:0.72rem;color:var(--chalk-dim);margin-top:2px;}

  .week-row{display:flex;justify-content:space-between;margin-top:14px;}
  .day-dot{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:0.72rem;color:var(--chalk-dim);
  }
  .day-dot.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;}

  .see-history{
    display:block;text-align:center;margin-top:14px;font-size:0.82rem;font-weight:700;
    color:var(--accent);background:none;border:none;cursor:pointer;width:100%;padding:6px;
  }
  .history-summary{display:flex;gap:10px;margin-bottom:26px;}
  .history-summary .stat{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:14px 8px;text-align:center;
  }
  .history-summary .stat .n{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--accent);}
  .history-summary .stat .l{font-size:0.68rem;color:var(--chalk-dim);margin-top:2px;}
  .month-heading{
    font-size:0.78rem;font-weight:700;color:var(--chalk-dim);text-transform:capitalize;
    margin:22px 0 10px;
  }
  .history-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;
  }
  .history-row .hd-date{font-size:0.72rem;color:var(--chalk-dim);width:34px;flex-shrink:0;text-align:center;}
  .history-row .hd-date b{display:block;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--chalk);}
  .history-row .hd-info{flex:1;}
  .history-row .hd-info .name{font-weight:700;font-size:0.9rem;}
  .history-row .hd-info .sub{font-size:0.76rem;color:var(--chalk-dim);margin-top:2px;}
  .history-row .hd-pts{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent);white-space:nowrap;}
  .empty-history{color:var(--chalk-dim);font-size:0.9rem;text-align:center;padding:40px 0;}

  .reminder-row{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
  }
  .switch{
    width:46px;height:26px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex-shrink:0;padding:0;
  }
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
    background:var(--chalk-dim);transition:transform .15s ease, background .15s ease;
  }
  .switch.on{background:#3a4318;border-color:var(--accent);}
  .switch.on::after{transform:translateX(20px);background:var(--accent);}
  .time-input{
    margin-top:10px;width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--chalk);padding:12px;border-radius:6px;font-size:1rem;font-family:'Inter',sans-serif;
  }

  @media(min-width:600px){
    .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .home-grid .prog-card{margin-bottom:0;}
  }
</style>
</head>

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function localTimeToUTC(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return { hourUTC: d.getUTCHours(), minuteUTC: d.getUTCMinutes() };
}
async function subscribeToPush(reminderTime){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }
  const { hourUTC, minuteUTC } = localTimeToUTC(reminderTime);
  await fetch('/.netlify/functions/subscribe', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ subscription: sub.toJSON(), hourUTC, minuteUTC })
  });
  return sub;
}
async function unsubscribeFromPush(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await fetch('/.netlify/functions/unsubscribe', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ endpoint: sub.endpoint })
      });
      await sub.unsubscribe();
    }
  }catch(e){}
}

let actx;
function beep(freq=880,dur=0.12,vol=0.18){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.frequency.value = freq; o.type='sine';
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}

function programExerciseIds(program){
  return program.format === 'circuit' ? program.exercises : program.exercises.map(e => e.id);
}
function programDifficultyMultiplier(program){
  const ids = programExerciseIds(program);
  if(!ids.length) return 1;
  const avg = ids.reduce((sum,id) => sum + ((EX[id] && EX[id].difficulty) || 1), 0) / ids.length;
  return 1 + (avg - 1) * 0.25; // difficulté 1 → x1, 2 → x1.25, 3 → x1.5
}
function difficultyLabel(mult){
  if(mult < 1.15) return 'Facile';
  if(mult < 1.4) return 'Intermédiaire';
  return 'Avancé';
}
function historyDates(){
  return (profile.history||[]).map(h => typeof h === 'string' ? h : h.date);

function hasTrainedOn(dateStr){

}

function updateProfileOnComplete(){
  const today = todayStr();
  if(!profile.history) profile.history = [];
  const trainedTodayAlready = hasTrainedOn(today);
  const minutes = lastSessionMinutes;
  const diffMult = programDifficultyMultiplier(session.program);

  if(!trainedTodayAlready){
    if(profile.lastDate && daysBetween(profile.lastDate, today) === 1){
      profile.streak = (profile.streak||0) + 1;
    } else {
      profile.streak = 1;
    }
    profile.lastDate = today;
    profile.longestStreak = Math.max(profile.longestStreak||0, profile.streak);
  }

  const base = Math.round(minutes * 4 * diffMult);
  const streakBonus = Math.min(((profile.streak||1) - 1) * 2, 20);
  lastEarnedPoints = Math.max(base, 10) + streakBonus;
  lastSessionDifficultyLabel = difficultyLabel(diffMult);

  profile.points = (profile.points||0) + lastEarnedPoints;
  profile.history.push({
    date: today,
    programName: session.program.name,
    format: session.program.format,
    minutes,
    points: lastEarnedPoints
  });
  saveProfile(profile);
}

/* ---------------- PHASE BUILDER ---------------- */
function buildPhases(program){
  const phases = [];
  if(program.format === 'circuit'){
    const firstName = exName(program.exercises[0]);
    phases.push({type:'ready', exName:firstName, duration:10, meta:{}});
    for(let r=1;r<=program.rounds;r++){
      program.exercises.forEach((exId,i)=>{
        phases.push({type:'work', exName:exName(exId), duration:program.work,
          meta:{round:r,totalRounds:program.rounds,exPos:i+1,totalEx:program.exercises.length}});
        const isLastInRound = i === program.exercises.length-1;
        const isLastRound = r === program.rounds;
        if(!(isLastInRound && isLastRound)){
          const nextId = isLastInRound ? program.exercises[0] : program.exercises[i+1];
          phases.push({type: isLastInRound ? 'setrest':'rest', exName: exName(nextId),
            duration: isLastInRound ? program.restBetweenRounds : program.rest,
            meta:{round:r,totalRounds:program.rounds}});
        }
      });
    }
  } else {
    const firstName = exName(program.exercises[0].id);
    phases.push({type:'ready', exName:firstName, duration:10, meta:{}});
    program.exercises.forEach((exObj,exIdx)=>{
      for(let s=1;s<=exObj.sets;s++){
        if(exObj.hold){
          phases.push({type:'work', exName:exName(exObj.id), duration:exObj.hold,
            meta:{set:s,totalSets:exObj.sets,hold:true}});
        } else {
          phases.push({type:'manual', exName:exName(exObj.id), duration:null,
            meta:{set:s,totalSets:exObj.sets,reps:exObj.reps}});
        }
        const isLastSet = s === exObj.sets;
        const isLastEx = exIdx === program.exercises.length-1;
        if(!(isLastSet && isLastEx)){
          const nextName = isLastSet ? exName(program.exercises[exIdx+1].id) : exName(exObj.id);
          phases.push({type:'rest', exName: nextName, duration: program.restBetweenSets, meta:{}});
        }
      }
    });
  }
  return phases;
}

const HOLD_EXERCISES = ['wall_sit','gainage_planche','gainage_lateral','l_sit','hollow_body_hold','handstand_mur','tuck_planche'];

function poolForGroups(groupKeys){
  const seen = new Set(); const list = [];
  groupKeys.forEach(k => (GROUPS[k].pool||[]).forEach(id => { if(!seen.has(id)){ seen.add(id); list.push(id); } }));
  return list;
}

// Picks a variety of exercises spread across the chosen groups (round-robin) up to desiredCount.
function pickAcrossGroups(groupKeys, desiredCount){
  const perGroupPools = groupKeys.map(k => GROUPS[k].pool.slice());
  const chosen = []; let gi = 0; let guard = 0;
  while(chosen.length < desiredCount && guard < 200){
    const gp = perGroupPools[gi % perGroupPools.length];
    if(gp.length){
      const id = gp.shift();
      if(!chosen.includes(id)) chosen.push(id);
    }
    gi++; guard++;
    if(perGroupPools.every(p => p.length === 0)) break;
  }
  return chosen;
}

function groupLabelFor(groupKeys){
  return groupKeys.length >= 4 ? 'Full body' : groupKeys.map(k => GROUPS[k].label).join(' + ');
}

// Builds a program sized to fit the requested time, from the chosen muscle groups.
function buildCustomProgram(groupKeys, minutes, format){
  if(!groupKeys.length) groupKeys = Object.keys(GROUPS);
  const poolSize = poolForGroups(groupKeys).length;
  let desiredCount = minutes <= 10 ? 4 : minutes <= 20 ? 5 : minutes <= 35 ? 6 : 8;
  desiredCount = Math.max(3, Math.min(desiredCount, poolSize));
  const chosen = pickAcrossGroups(groupKeys, desiredCount);
  const label = groupLabelFor(groupKeys);

  if(format === 'circuit'){
    const work = 35, rest = 20, restBetweenRounds = 50, ready = 10;
    const perRound = chosen.length*work + (chosen.length-1)*rest + restBetweenRounds;
    let rounds = Math.round((minutes*60 - ready + restBetweenRounds) / perRound);
    rounds = Math.max(1, Math.min(6, rounds));
    return {id:'custom-circuit', name:label+' · '+minutes+' min', tagline:'Circuit généré pour ton temps disponible',
      format:'circuit', duration:'≈ '+minutes+' min', rounds, work, rest, restBetweenRounds, exercises:chosen};
  } else {
    const sets = minutes <= 15 ? 2 : minutes <= 30 ? 3 : 4;
    return {id:'custom-classic', name:label+' · '+minutes+' min', tagline:'Séries générées pour ton temps disponible',
      format:'classic', duration:'≈ '+minutes+' min', restBetweenSets:60,
      exercises: chosen.map(id => HOLD_EXERCISES.includes(id) ? {id, sets, hold:30} : {id, sets, reps:'12'})};
  }
}

    .map(h => typeof h === 'string' ? {date:h, programName:'Séance', minutes:null, points:null} : h)
    .slice()
    .sort((a,b) => b.date.localeCompare(a.date));

  const totalSessions = records.length;
  const totalMinutes = records.reduce((s,r) => s + (r.minutes||0), 0);

  let groupsHtml = '';
  if(records.length === 0){
    groupsHtml = `<div class="empty-history">Pas encore de séance enregistrée.<br>Termine ta première séance pour commencer ton historique.</div>`;
  } else {
    let currentMonthKey = null;
    records.forEach(r => {
      const [y,m,d] = r.date.split('-');
      const monthKey = y+'-'+m;
      if(monthKey !== currentMonthKey){
        currentMonthKey = monthKey;
        groupsHtml += `<div class="month-heading">${MONTH_NAMES[parseInt(m,10)-1]} ${y}</div>`;
      }
      groupsHtml += `
        <div class="history-row">
          <div class="hd-date">${MONTH_NAMES[parseInt(m,10)-1].slice(0,3)}<b>${d}</b></div>
          <div class="hd-info">
            <div class="name">${r.programName}</div>
            <div class="sub">${r.minutes ? r.minutes+' min' : ''}${r.minutes && r.format ? ' · ' : ''}${r.format==='circuit'?'Circuit':r.format==='classic'?'Séries':''}</div>
          </div>
          <div class="hd-pts">${r.points ? '+'+r.points : ''}</div>
        </div>
      `;
    });
  }

  app.innerHTML = `
    <button class="back" onclick="goHome()">‹ Retour</button>
    <div class="header">
      <div class="kicker">Historique</div>
      <h1>Tes séances</h1>
      <p class="tagline">🔥 ${profile.streak||0} jour${(profile.streak||0)>1?'s':''} de suite · record : ${profile.longestStreak||0} jour${(profile.longestStreak||0)>1?'s':''}</p>
    </div>

    <div class="history-summary">
      <div class="stat"><div class="n">${totalSessions}</div><div class="l">séances</div></div>
      <div class="stat"><div class="n">${totalMinutes}</div><div class="l">minutes</div></div>
      <div class="stat"><div class="n">${profile.points||0}</div><div class="l">points</div></div>
    </div>

    ${groupsHtml}
  `;
}

/* ---------------- SESSION ENGINE ---------------- */
function startSession(program){
  const phases = buildPhases(program);
  session = {program, phases, phaseIndex:0};
  sessionStartTime = Date.now();
  confirmingQuit = false;
  enterPhase(0, true);
  view = 'session';
  startTicking();
}

function enterPhase(index, isFirst){
  session.phaseIndex = index;
  const phase = session.phases[index];
  timerState.isPaused = false;
  timerState.lastTickSecond = null;
  timerState.phaseStart = Date.now();
  timerState.remaining = phase.duration;
  if(!isFirst){
    beep(990,0.15); vibrate(180);
  }
  renderSession();
}

function advancePhase(){
  const nextIndex = session.phaseIndex + 1;
  if(nextIndex >= session.phases.length){
    finishSession();
  } else {
    enterPhase(nextIndex, false);
  }
}

function finishSession(){
  stopTicking();
  lastSessionMinutes = Math.max(1, Math.round((Date.now() - sessionStartTime) / 60000));
  beep(1200,0.1); setTimeout(()=>beep(1500,0.2),140);
  vibrate([150,80,150,80,250]);
  updateProfileOnComplete();
  view = 'complete';
  renderComplete();
}

function startTicking(){
  stopTicking();
  tickHandle = setInterval(tick, 200);
}
function stopTicking(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
}

function tick(){
  if(!session || view !== 'session' || timerState.isPaused) return;
  const phase = session.phases[session.phaseIndex];
  if(phase.duration == null) return; // manual phase, waits for user
  const elapsed = (Date.now() - timerState.phaseStart) / 1000;
  const remaining = Math.max(0, phase.duration - elapsed);
  timerState.remaining = remaining;
  const rounded = Math.ceil(remaining);
  if(rounded <= 3 && rounded > 0 && rounded !== timerState.lastTickSecond){
    timerState.lastTickSecond = rounded;
    beep(660,0.08,0.14);
  }
  updateTimerDisplayOnly();
  if(remaining <= 0){
    advancePhase();
  }
}

function updateTimerDisplayOnly(){
  const el = document.getElementById('timerDigits');
  const fillEl = document.getElementById('progressFill');
  if(!el) return;
  const phase = session.phases[session.phaseIndex];
  el.textContent = fmt(timerState.remaining);
  el.classList.toggle('urgent', Math.ceil(timerState.remaining) <= 3);
  if(fillEl){
    const pct = Math.round(((session.phaseIndex) / session.phases.length) * 100);
    fillEl.style.width = pct + '%';
  }
}

function togglePause(){
  if(!timerState.isPaused){
    timerState.pausedRemaining = timerState.remaining;
    timerState.isPaused = true;
  } else {
    timerState.phaseStart = Date.now() - ((session.phases[session.phaseIndex].duration - timerState.pausedRemaining) * 1000);
    timerState.isPaused = false;
  }
  renderSession();
}

function skipPhase(){ advancePhase(); }
function completeManualSet(){ advancePhase(); }

function askQuit(){ confirmingQuit = true; renderSession(); }
function cancelQuit(){ confirmingQuit = false; renderSession(); }
function confirmQuit(){ goHome(); }

/* ---------------- RENDER: SESSION ---------------- */
function phaseLabelText(phase){
  if(phase.type === 'ready') return 'Prêt ?';
  if(phase.type === 'work') return phase.meta.hold ? 'Maintiens' : 'Travail';
  if(phase.type === 'rest' || phase.type === 'setrest') return 'Repos';
  if(phase.type === 'manual') return 'À toi de jouer';
  return '';
}
function phaseLabelClass(phase){
  if(phase.type === 'ready') return 'ready';
  if(phase.type === 'work') return 'work';
  if(phase.type === 'manual') return 'manual';
  return 'rest';
}
function metaLine(program, phase){
  if(program.format === 'circuit'){
    if(phase.type === 'ready') return '';
    return `Tour ${phase.meta.round} / ${phase.meta.totalRounds}`;
  } else {
    if(phase.type === 'ready') return '';
    if(phase.meta.set) return `Série ${phase.meta.set} / ${phase.meta.totalSets}`;
    return '';
  }
}

function renderSession(){
  const app = document.getElementById('app');
  const phase = session.phases[session.phaseIndex];
  const program = session.program;
  const pct = Math.round((session.phaseIndex / session.phases.length) * 100);
  const isManual = phase.type === 'manual';
  const nextPhase = session.phases[session.phaseIndex+1];

  app.innerHTML = `
    <div class="session-wrap">
      <div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${pct}%"></div></div>
        <div class="phase-meta">
          <span>${metaLine(program, phase)}</span>
          <span>${program.name}</span>
        </div>
        <div class="phase-label ${phaseLabelClass(phase)}">${phaseLabelText(phase)}</div>
        <div class="exercise-name">${phase.exName}</div>
      </div>

      <div class="timer-zone">
        ${isManual ? `
          <div class="reps-target">Objectif : <b>${phase.meta.reps}</b> répétitions</div>
          <button class="btn btn-primary" style="margin-top:22px;" onclick="completeManualSet()">Série terminée</button>
        ` : `
          <div class="timer-digits" id="timerDigits">${fmt(timerState.remaining)}</div>
          ${phase.meta && phase.meta.hold ? '<div class="reps-target">Tiens la position</div>' : ''}
        `}
        ${nextPhase ? `<div class="next-up">Ensuite : <b>${nextPhase.exName}</b></div>` : ''}
      </div>

      ${!isManual ? `
        <div class="controls">
          <button class="ctrl-btn" onclick="skipPhase()">Passer</button>
          <button class="ctrl-btn main" onclick="togglePause()">${timerState.isPaused ? 'Reprendre' : 'Pause'}</button>
        </div>
      ` : ''}

      ${confirmingQuit ? `
        <div class="quit-confirm">
          <p>Arrêter la séance en cours ?</p>
          <div class="btn-row" style="margin-top:0;">
            <button class="btn btn-ghost" onclick="cancelQuit()">Continuer</button>
            <button class="btn btn-danger" onclick="confirmQuit()">Arrêter</button>
          </div>
        </div>
      ` : `
        <div class="quit-zone"><button class="quit-link" onclick="askQuit()">Arrêter la séance</button></div>
      `}
    </div>
  `;
}

/* ---------------- RENDER: COMPLETE ---------------- */
function renderComplete(){
  const app = document.getElementById('app');
  const exCount = session.program.format === 'circuit'
    ? session.program.exercises.length
    : session.program.exercises.length;
  app.innerHTML = `
    <div class="complete-wrap">
      <h1>Séance terminée</h1>
      <p class="dim">${session.program.name}</p>
      <div class="stat-row">
        <div class="stat"><div class="n">${lastSessionMinutes}</div><div class="l">minutes</div></div>
        <div class="stat"><div class="n">${exCount}</div><div class="l">exercices</div></div>
        <div class="stat"><div class="n">+${lastEarnedPoints}</div><div class="l">points</div></div>
      </div>
      <p class="dim" style="font-size:0.8rem;margin-bottom:4px;">Difficulté ${lastSessionDifficultyLabel} · ${lastSessionMinutes} min → ${lastEarnedPoints} points</p>
      <p class="dim" style="margin-bottom:22px;">🔥 Série en cours : <b style="color:var(--chalk);">${profile.streak}</b> jour${profile.streak>1?'s':''}</p>
      <button class="btn btn-primary" style="max-width:280px;" onclick="goHome()">Retour à l'accueil</button>
    </div>
  `;
}

/* ---------------- INIT ---------------- */
(async function init(){
  profile = await loadProfile();
  renderHome();
  startReminderChecker();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // Silencieux : si le fichier est ouvert hors d'un serveur (file://), le mode hors-ligne
      // n'est simplement pas disponible, mais le reste de l'appli continue de fonctionner normalement.
    });
  });
}
